<mat-card class="cardWithShadow metric-card">
  <mat-card-content>
    <div class="metric-content">
      <div class="metric-icon-wrapper calls-icon">
        <mat-icon>phone</mat-icon>
      </div>
      <div class="metric-details">
        <div class="metric-label">Total Calls</div>
        <div class="metric-value">{{ totalCalls | number }}</div>
        <div class="metric-change" [ngClass]="{'positive': isPositive, 'negative': !isPositive}">
          <mat-icon>{{ isPositive ? 'trending_up' : 'trending_down' }}</mat-icon>
          <span>{{ changePercent }}% from last month</span>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
